<!DOCTYPE html>

<body>
    <h1>TP1...</h1>
    <section id="crit-gen">
        <h2>1. Critères généraux</h2>
        <h3>Description</h3>
            <!-- 
            • Description générale du logiciel. Justification de la pertinence du logiciel pour l'édition numérique.
            • Type de logiciel (libre, propriétaire, etc.)
            • Type de licence (fixe, libre, académique, mixte, etc.)
            • Coût
            • Langage de programmation (Python, Java, etc.)
            -->
        <h3>Maturité du logiciel</h3>
            <!-- 
            • Âge du logiciel
            • Année en affaires de l'entreprise
            • Nombre de mois depuis la dernière mise à jour
            • Le logiciel est-il encore supporté par le développeur ou le créateur
            -->
        <h3>Interopérabilité</h3>
            <!-- 
            Critères qui impliquent la capacité du logiciel à s'harmoniser avec le système déjà en place et sa faculté de
            fonctionner conjointement avec d'autres ressources logicielles et matérielles.
            • Compatibilité avec les plateformes et systèmes d'exploitation
            • Intégration Web
            • Intégration à d'autres applications
            • Dépendances logicielles ou matérielles
            -->
        <h3>Soutien technique</h3>
            <!-- 
            Critères qui mesurent l'aide disponible pour les utilisateurs du logiciel.
            • Accès à une version de démonstration
            • Assistance technique
            • Documentation
            • Tutoriel
            • Communauté
            -->
    </section>
    <section id="crit-tech">
        <h2>2. Critères techniques</h2>
        <h3>Fonctionnalités</h3>
            <!-- 
            • Description des fonctionnalités du logiciel (veuillez être le plus exhaustif possible)
            Utilisabilité
            • Facilité d'installation
            • Facilité d'utilisation
            • Facilité d'apprentissage
            -->
    </section>
    <section id="eval">
        <h2>3. Évaluation</h2>
            <!-- 
            • Points positifs
            • Points négatifs
            • Autres remarques
            -->
    </section>
    <section id="capt-ecrans">
        <h2>4. Copies d'écrans</h2>
    </section>
    <section id="references">
        <h2>5. Références</h2>
        <ul>
            <li></li>
        </ul>
    </section>
</body>
</html>
